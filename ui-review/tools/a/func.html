<!doctype html><meta charset=utf-8><iframe id=f src="app.html?cam=top&t=5&ep=miss#map" style="width:1280px;height:800px;border:0"></iframe><pre id=out></pre>
<script>
const f=document.getElementById('f'); const R={errs:[]};
f.addEventListener('load',()=>{ const w=f.contentWindow,d=f.contentDocument; w.addEventListener('error',e=>R.errs.push(String(e.message)));
 const evs=[]; w.addEventListener('airtight:time',e=>evs.push(e.detail));
 setTimeout(()=>{ R.three=!!w.THREE; R.canvas=!!d.querySelector('#viewer canvas'); R.clock0=d.getElementById('mapClock').textContent; R.ep0=d.querySelector('#mapEp [aria-pressed=true]').dataset.ep;
  w.sceneSetTime(40,'catch'); R.evAfterSet=evs.length;
  w.dispatchEvent(new CustomEvent('airtight:time',{detail:{t:12,episode:'miss'}}));
  setTimeout(()=>{ R.clockAfterEvent=d.getElementById('mapClock').textContent; R.epAfterEvent=d.querySelector('#mapEp [aria-pressed=true]').dataset.ep;
   const v=d.getElementById('viewer'), r=v.getBoundingClientRect(); const s0=d.querySelector('#mapScale i').style.width;
   v.dispatchEvent(new w.WheelEvent('wheel',{deltaY:-300,clientX:r.left+r.width*0.7,clientY:r.top+r.height*0.5,bubbles:true,cancelable:true}));
   for(let i=0;i<3;i++) v.dispatchEvent(new w.WheelEvent('wheel',{deltaY:-60,clientX:r.left+r.width*0.7,clientY:r.top+r.height*0.5,bubbles:true,cancelable:true}));
   v.dispatchEvent(new w.PointerEvent('pointerdown',{pointerId:1,button:0,clientX:r.left+300,clientY:r.top+300,bubbles:true}));
   v.dispatchEvent(new w.PointerEvent('pointermove',{pointerId:1,clientX:r.left+380,clientY:r.top+200,bubbles:true}));
   v.dispatchEvent(new w.PointerEvent('pointerup',{pointerId:1,bubbles:true}));
   d.documentElement.dataset.theme='dark';
   d.getElementById('mapPlay').click(); const st=w.__sceneStats; const f0=st.frames, m0=st.ms;
   setTimeout(()=>{ R.scale=[s0,d.querySelector('#mapScale i').style.width]; R.clockPlaying=d.getElementById('mapClock').textContent; R.frames=st.frames-f0; R.msPerFrame=(st.ms-m0)/Math.max(1,st.frames-f0); R.events=evs.length; R.lastEv=evs[evs.length-1]; R.labelsShown=[...d.querySelectorAll('.m3-label')].filter(e=>e.style.visibility!=='hidden'&&e.textContent).length;
    d.getElementById('mapPlay').click(); const fi=st.frames; setTimeout(()=>{ R.idleFrames=st.frames-fi; document.getElementById('out').textContent=JSON.stringify(R); },1200); },2000); },300); },2500); });
</script>
