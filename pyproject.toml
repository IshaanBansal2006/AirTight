[project]
name = "airtight"
version = "0.0.0"
description = "Security-posture simulation for commercial sites: mixed drone, ground-robot and guard fleets on dimOS."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ishaan Bansal" }]
license = { text = "MIT" }

dependencies = [
    "dimos[all]",
    "numpy>=1.26",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.entry-points."dimos.blueprints"]
airtight-site = "airtight.dimos_lane.blueprint:airtight_site"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airtight"]

[tool.uv]
override-dependencies = [
    "embreex; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "opencv-python; sys_platform == 'never'",
    "pillow>=12.2.0",
    "pytest==8.3.5",
    "langgraph-prebuilt<=1.0.8",
    "importlib-metadata<8.8.0",
    "torch>=2.1,<2.8",
    "torchvision>=0.16,<0.23",
]

[tool.uv.sources]
dimos = { path = "../dimos", editable = true }
torch = [
    { index = "pytorch-cu128", marker = "(sys_platform == 'linux' and platform_machine == 'x86_64') or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "(sys_platform == 'linux' and platform_machine == 'x86_64') or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/airtight/swarm/**" = ["N802", "N803", "N806"]
"tests/swarm/**" = ["N802", "N803", "N806"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
